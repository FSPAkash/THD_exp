<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Hub - The Home Depot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font-sans:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
  --font-mono:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
  --bg-app:#FFFFFF; --bg-chrome:#FAFAFA; --bg-paper:#FFFFFF; --bg-input:#FFFFFF;
  --bg-hover:#F4F4F4; --bg-stripe:#FAFAFA;
  --ink:#111111; --ink-2:#3F3F3F; --ink-3:#757575; --ink-4:#A8A8A8;
  --line:#E5E5E5; --line-2:#EFEFEF; --line-strong:#D0D0D0;
  --accent:#F96302; --accent-ink:#C24E02; --accent-soft:#FBD9C0; --accent-tint:#FFF3EA;
  --ok:oklch(0.55 0.12 150); --ok-soft:oklch(0.94 0.05 150);
  --warn:oklch(0.62 0.13 70); --warn-soft:oklch(0.95 0.06 75); --warn-ink:oklch(0.48 0.13 65);
  --err:oklch(0.55 0.18 25);
  --shadow-window:0 1px 0 rgba(0,0,0,.03),0 12px 32px -8px rgba(60,40,20,.18),0 2px 6px rgba(60,40,20,.08);
  --r-card:6px; --r-input:4px; --r-win:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);font-size:14px;line-height:1.45;letter-spacing:-.005em;
  background:var(--bg-app);color:var(--ink);overflow:hidden;
  font-feature-settings:"tnum" 1,"ss01" 1;-webkit-font-smoothing:antialiased}
.mono{font-variant-numeric:tabular-nums}

/* chrome */
.brandbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--bg-chrome);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 26px;z-index:40}
.brandbar img{height:30px;width:30px;object-fit:contain}
.brandbar .t{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-2)}
.brandbar .t em{font-style:normal;color:var(--ink-3);font-weight:600}
.brandstrip{position:fixed;top:52px;left:0;right:0;height:3px;z-index:41;
  background:linear-gradient(to right,#F96302 0,#F96302 84%,#F5A623 84%,#F5A623 100%)}
.statusbar{position:fixed;bottom:0;left:0;right:0;height:34px;background:var(--bg-chrome);
  border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;z-index:40;
  font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-3)}
.statusbar .ldot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.statusbar .sep{width:1px;height:14px;background:var(--line)}
.statusbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}

#deck{position:absolute;top:55px;bottom:34px;left:0;right:0}
.slide{position:absolute;inset:0;display:none;flex-direction:column}
.slide.active{display:flex}
.pad{flex:1;display:flex;flex-direction:column;padding:clamp(18px,3.2vh,34px) clamp(28px,4vw,56px) clamp(14px,2.4vh,24px);min-height:0;overflow:hidden}

/* entrance */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.slide.active .en{opacity:0;animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both}
.slide.active .en.d1{animation-delay:.05s}.slide.active .en.d2{animation-delay:.10s}
.slide.active .en.d3{animation-delay:.16s}.slide.active .en.d4{animation-delay:.22s}
.slide.active .stag>*{opacity:0;animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both}
.slide.active .stag>*:nth-child(1){animation-delay:.08s}.slide.active .stag>*:nth-child(2){animation-delay:.14s}
.slide.active .stag>*:nth-child(3){animation-delay:.20s}.slide.active .stag>*:nth-child(4){animation-delay:.26s}
.slide.active .stag>*:nth-child(5){animation-delay:.32s}.slide.active .stag>*:nth-child(6){animation-delay:.38s}

.eyebrow{display:flex;align-items:center;gap:9px;font-size:clamp(10px,.9vh,12px);font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent-ink);margin-bottom:clamp(8px,1.3vh,13px)}
.eyebrow .bar{width:26px;height:2px;background:var(--accent)}
h1{font-size:clamp(30px,2.2vw+1.6vh,54px);font-weight:700;letter-spacing:-.025em;line-height:1.04;color:var(--ink)}
h1 em{font-style:normal;color:var(--accent-ink)}
h2{font-size:clamp(19px,1.1vw+1.2vh,30px);font-weight:700;letter-spacing:-.02em;line-height:1.15;color:var(--ink);margin-bottom:clamp(3px,.6vh,6px)}
.lede{font-size:clamp(12.5px,.5vw+.7vh,15px);color:var(--ink-2);max-width:96ch;margin-top:clamp(3px,.6vh,6px);line-height:1.5}
.lede b{color:var(--ink);font-weight:600}
.microlabel{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.spacer{flex:1}

/* card */
.card{background:var(--bg-paper);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column}
.card-head{min-height:32px;padding:7px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line-2);
  background:var(--bg-stripe);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.card-head .dot-r{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.card-head .tail{margin-left:auto;font-weight:600;color:var(--ink-3);letter-spacing:0;text-transform:none;font-size:11px;font-variant-numeric:tabular-nums}
.card-body{padding:14px;flex:1}

/* stat tile */
.stat{border:1px solid var(--line);background:var(--bg-paper);border-radius:var(--r-card);padding:clamp(9px,1.5vh,13px) 14px}
.stat .label{font-size:clamp(9px,1.1vh,10px);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.stat .value{font-variant-numeric:tabular-nums;font-size:clamp(22px,3.3vh,30px);font-weight:700;color:var(--ink);margin-top:clamp(2px,.5vh,4px);line-height:1}
.stat .value .u{font-size:clamp(12px,1.7vh,15px);color:var(--ink-3);font-weight:600}
.stat .value.o{color:var(--accent-ink)} .stat .value.ok{color:var(--ok)}
.stat .ctx{font-size:clamp(10px,1.2vh,11px);color:var(--ink-3);margin-top:clamp(5px,1vh,8px);line-height:1.4}
.stat .ctx b{color:var(--ink-2);font-weight:600}

.grid{display:grid;gap:11px}
.row{display:flex;gap:10px;align-items:center}

/* chip */
.chip{display:inline-flex;align-items:center;gap:6px;height:21px;padding:0 9px;border-radius:11px;
  font-size:10px;font-variant-numeric:tabular-nums;font-weight:600;background:var(--bg-hover);color:var(--ink-2);
  border:1px solid var(--line-2);text-transform:uppercase;letter-spacing:.05em}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.accent{background:var(--accent-tint);color:var(--accent-ink);border-color:transparent}
.cdot{width:7px;height:7px;border-radius:50%;flex:none}
.cdot.b{background:var(--ink-3)} .cdot.p{background:var(--ok)} .cdot.f{background:var(--accent)}

.callout{padding:clamp(9px,1.6vh,13px) 15px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--bg-stripe)}
.callout p{font-size:clamp(11.5px,1.5vh,13px);font-weight:500;color:var(--ink);line-height:1.45}
.callout .o{color:var(--accent-ink);font-weight:700}

/* module columns - hub product surfaces */
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;min-height:0;margin:auto 0;align-items:stretch}
.modcol{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.modcol .modhd{padding:11px 13px;border-bottom:1px solid var(--line-2);background:var(--bg-stripe)}
.modcol .modhd .mt{font-size:clamp(13px,1.7vh,15px);font-weight:700;letter-spacing:-.01em;color:var(--ink);display:flex;align-items:center;gap:9px}
.modcol .modhd .mt .mk{width:24px;height:24px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.modcol .modhd .mq{font-size:10.5px;color:var(--ink-3);margin-top:6px;line-height:1.4}
.modbody{padding:clamp(12px,2vh,20px) 13px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,2vh,18px)}
.mitem{font-size:clamp(10.5px,1.35vh,12px);color:var(--ink-2);line-height:1.35;padding-left:15px;position:relative}
.mitem::before{content:"";position:absolute;left:2px;top:.5em;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.mitem b{color:var(--ink);font-weight:600}
.modfoot{padding:8px 12px;border-top:1px solid var(--line-2);background:var(--bg-stripe);font-size:10px;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.modfoot .ev{font-weight:700;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.05em}

/* I-CUPP flow columns */
.icupp{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:auto;margin-bottom:auto;min-height:0;align-items:stretch}
.icol{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.icol.exp{border-color:var(--accent-soft)}
.icol .ihd{padding:clamp(9px,1.4vh,13px) 14px;border-bottom:1px solid var(--line-2);background:var(--bg-stripe);display:flex;align-items:center;gap:10px}
.icol.exp .ihd{background:var(--accent-tint)}
.icol .ihd .lk{width:clamp(22px,2.6vh,26px);height:clamp(22px,2.6vh,26px);border-radius:6px;font-size:clamp(11px,1.4vh,13px);background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.icol .ihd .nm{font-size:clamp(12px,1.5vh,14px);font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.icol.exp .ihd .nm{color:var(--accent-ink)}
.icol .ibody{padding:clamp(10px,1.6vh,14px) 13px;flex:1;display:flex;flex-direction:column;gap:clamp(6px,1.1vh,10px)}
.iitem{font-size:clamp(10.5px,1.3vh,12.5px);color:var(--ink-2);line-height:1.3;padding-left:15px;position:relative}
.iitem::before{content:"";position:absolute;left:2px;top:.5em;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.iitem.f{color:var(--accent-ink);font-weight:600} .iitem.f::before{background:var(--accent)}
.icol .ifoot{padding:8px 11px;border-top:1px solid var(--line-2);background:var(--bg-stripe);display:flex}
.istat{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--ok-soft);color:var(--ok)}
.istat.exp{background:var(--accent-tint);color:var(--accent-ink)}

/* table */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--bg-paper);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.tbl thead th{background:var(--bg-stripe);border-bottom:1px solid var(--line);padding:8px 12px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;white-space:nowrap}
.tbl tbody td{padding:clamp(7px,1.3vh,9px) 12px;border-bottom:1px solid var(--line-2);font-size:clamp(11px,1.5vh,12.5px);color:var(--ink);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:nth-child(even) td{background:rgba(0,0,0,0.012)}
.tbl td.lay{font-weight:700;white-space:nowrap;vertical-align:middle}
.tbl .lkk{display:inline-flex;width:18px;height:18px;border-radius:4px;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-size:10px;font-weight:800;margin-right:8px;vertical-align:-4px}

/* wrap up phase columns */
.phase{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin:auto 0;min-height:0}
.phasecol{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.phasecol.future{border-color:var(--accent-soft)}
.phasehd{padding:8px 12px;border-bottom:1px solid var(--line-2);background:var(--bg-stripe);display:flex;align-items:center;gap:9px}
.phasecol.future .phasehd{background:var(--accent-tint)}
.phasehd .ph{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.phasehd .sub{margin-left:auto;font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.phasebody{padding:11px;flex:1;display:flex;flex-direction:column;gap:clamp(6px,1.1vh,9px)}
.engine{border:1px solid var(--line-2);border-radius:var(--r-input);padding:clamp(7px,1.3vh,9px) 11px;transition:background 120ms}
.engine:hover{background:var(--bg-hover)}
.engine .et{font-size:clamp(11px,1.5vh,12.5px);font-weight:700;letter-spacing:-.01em;color:var(--ink);display:flex;align-items:center;gap:7px}
.engine .ed{font-size:clamp(10px,1.3vh,11px);color:var(--ink-3);margin-top:3px;line-height:1.4}

.legend{display:flex;gap:16px;margin-top:8px;font-size:10.5px;color:var(--ink-3);align-items:center;text-transform:uppercase;letter-spacing:.06em;font-weight:600;flex-wrap:wrap}
.legend b{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink-2)}
.legend .sq{width:9px;height:9px;border-radius:2px}
.legend .sq.b{background:var(--ok)} .legend .sq.f{background:var(--accent)}

/* nav */
#nav{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px}
#nav button{border:1px solid var(--line);background:#fff;color:var(--ink-2);width:24px;height:24px;border-radius:50%;font-size:14px;cursor:pointer;display:grid;place-items:center;transition:.12s;line-height:1}
#nav button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
#nav button:disabled{opacity:.35;cursor:default;background:#fff;color:var(--ink-3);border-color:var(--line)}
#dots{display:flex;align-items:center;gap:6px;padding:0 2px}
#dots .d{width:7px;height:7px;border-radius:50%;background:var(--line-strong);cursor:pointer;transition:width .18s,background .18s}
#dots .d:hover{background:var(--ink-4)}
#dots .d.on{background:var(--accent);width:18px;border-radius:99px}
.hide-sm{} @media (max-width:880px){.hide-sm{display:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.slide.active .en,.slide.active .stag>*{opacity:1}}
</style>
</head>
<body>
<div class="brandbar"><img src="THD.png" alt="The Home Depot"><span class="t">The Home Depot <em>· Advanced Analytics</em></span></div>
<div class="brandstrip"></div>
<div id="deck"></div>
<div class="statusbar mono">
  <span class="ldot"></span><span>ANALYTICS HUB · IN DEVELOPMENT</span>
  <span class="sep"></span><span class="hide-sm">Analytics · Reporting · Prediction</span>
  <div id="nav"><button id="prev" aria-label="Previous">&#8249;</button><div id="dots"></div><button id="next" aria-label="Next">&#8250;</button></div>
  <span class="right"><span id="sb-pos">01 / 05</span></span>
</div>

<script>
const slides=[];

/* 1 - TITLE */
slides.push(`
<div class="slide"><div class="pad">
  <div class="spacer"></div>
  <div class="eyebrow en"><span class="bar"></span>The Home Depot · Advanced Analytics</div>
  <h1 class="en d1">The Analytics Hub.<br><em>One platform for every KPI.</em></h1>
  <p class="lede en d2" style="margin-top:16px;max-width:88ch">An end-to-end, AI-assisted analytics platform for KPI tracking, pre/post launch impact analysis and automated reporting. It brings the team's proven engines into one self-serve surface, with <b>Reporting</b> and <b>Prediction</b> hubs built in. Analysts and stakeholders get answers without waiting on a custom pull.</p>
  <div class="grid en d4" style="grid-template-columns:repeat(3,1fr);margin-top:28px;max-width:760px">
    <div class="stat"><div class="label">Built on</div><div class="value o">React · Flask</div><div class="ctx">BigQuery warehouse · Prophet forecasting · WeasyPrint reporting</div></div>
    <div class="stat"><div class="label">Surfaces in one hub</div><div class="value mono">3</div><div class="ctx">AI-assisted Analytics · Reporting Hub · Prediction Hub</div></div>
    <div class="stat"><div class="label">Platform status</div><div class="value ok">In dev</div><div class="ctx">30+ endpoint REST API · role-based access · feedback loop live</div></div>
  </div>
  <div class="spacer"></div>
  <div class="row en"><span class="microlabel">Analytics · Reporting · Prediction</span><span class="microlabel" style="margin-left:auto">Confidential - prepared for THD leadership</span></div>
</div></div>`);

/* 2 - WHAT THE HUB IS - three module surfaces */
slides.push(`
<div class="slide"><div class="pad">
  <div class="eyebrow en"><span class="bar"></span>The product - one hub, three surfaces</div>
  <h2 class="en d1">Analytics, Reporting and Prediction, in one place</h2>
  <p class="lede en d2">The Hub is a single AI-assisted platform. <b>Reporting</b> and <b>Prediction</b> are modules inside it: the same self-serve UI, the same BigQuery data, the same auth. Each evolves from a proven engine the team already shipped, now packaged so analysts run it themselves.</p>
  <div class="mods stag">
    <div class="modcol">
      <div class="modhd"><div class="mt"><span class="mk">A</span>AI-Assisted Analytics</div><div class="mq">The platform core - track, slice and monitor any KPI</div></div>
      <div class="modbody">
        <div class="mitem"><b>KPI tracking</b> with pre/post launch impact analysis</div>
        <div class="mitem">Role-based access via <b>JWT auth</b> - standard vs prototype users</div>
        <div class="mitem"><b>30+ endpoint REST API</b> over the BigQuery warehouse</div>
        <div class="mitem">In-app feedback wired to <b>GitHub Issues</b> - closed-loop iteration</div>
        <div class="mitem">Anomaly flagging and event-annotated timeseries</div>
      </div>
      <div class="modfoot"><span class="ev">Core</span>· React · Flask · BigQuery</div>
    </div>
    <div class="modcol">
      <div class="modhd"><div class="mt"><span class="mk">R</span>Reporting Hub</div><div class="mq">Self-service reporting - upload to PDF without an analyst pull</div></div>
      <div class="modbody">
        <div class="mitem">Analysts <b>upload Excel</b>; the system <b>auto-detects schema</b></div>
        <div class="mitem">Runs <b>Prophet counterfactual modelling</b> on the data</div>
        <div class="mitem">Outputs interactive charts, <b>lift summaries</b> and PDF reports</div>
        <div class="mitem"><b>Preview, email or save as draft</b> straight from the UI</div>
        <div class="mitem">One-click standardized PDF/PPT via custom dashboard</div>
      </div>
      <div class="modfoot"><span class="ev">Evolves from</span>Automated Report Generation</div>
    </div>
    <div class="modcol">
      <div class="modhd"><div class="mt"><span class="mk">P</span>Prediction Hub</div><div class="mq">Self-serve counterfactual forecasting and lift</div></div>
      <div class="modbody">
        <div class="mitem">Fits on <b>pre-period</b> data, forecasts into the <b>post-period</b></div>
        <div class="mitem">Calculates statistical <b>lift</b> vs a non-intervention baseline</div>
        <div class="mitem"><b>Segment-level granularity</b> - HHID, Visit, Segment reads</div>
        <div class="mitem">Multi-KPI <b>parallel runs</b> via BigQuery</div>
        <div class="mitem">Auto schema detection on arbitrary uploaded data</div>
      </div>
      <div class="modfoot"><span class="ev">Evolves from</span>Post-Launch Incrementality (PLI)</div>
    </div>
  </div>
  <div class="callout en" style="margin-top:14px"><p>Reporting and Prediction are not separate tools - they are <span class="o">modules of the Analytics Hub</span>, sharing its data, auth and UI so the whole team works from one surface.</p></div>
</div></div>`);

/* 3 - HUB ON I-CUPP */
slides.push(`
<div class="slide"><div class="pad">
  <div class="eyebrow en"><span class="bar"></span>Where the Hub sits - the I-CUPP production line</div>
  <h2 class="en d1">The Hub is the Presentation layer - and the self-serve door to Processing</h2>
  <p class="lede en d2">Every engine runs five layers: THD provides infrastructure (I), the team collects raw data (C) and unifies it (U), the engines process it into decisions (P), and the Hub presents it so people act (P). The Hub lives at <b>Presentation</b>. Its Reporting and Prediction modules also let users <b>trigger Processing</b> themselves, no analyst in the loop.</p>
  <div class="icupp stag">
    <div class="icol">
      <div class="ihd"><span class="lk">I</span><span class="nm">Infrastructure</span></div>
      <div class="ibody"><div class="iitem">BigQuery, 6TB+ store</div><div class="iitem">Clickstream, raw hits</div><div class="iitem">NURO data pipes</div><div class="iitem">Adobe Analytics, CJA</div><div class="iitem">JWT auth, access model</div></div>
      <div class="ifoot"><span class="istat">Provided - THD owned</span></div>
    </div>
    <div class="icol">
      <div class="ihd"><span class="lk">C</span><span class="nm">Collection</span></div>
      <div class="ibody"><div class="iitem">Excel / data upload</div><div class="iitem">Clickstream behavior</div><div class="iitem">HHID, Visit, Segment</div><div class="iitem">Sales &amp; demand</div><div class="iitem">OKR / BOF KPIs</div></div>
      <div class="ifoot"><span class="istat">Built</span></div>
    </div>

/* ===== ENGINE ===== */
const deck=document.getElementById('deck');
deck.innerHTML=slides.join('');
const S=[...document.querySelectorAll('.slide')];
let cur=0;
const dots=document.getElementById('dots');
S.forEach((_,i)=>{const d=document.createElement('div');d.className='d';d.onclick=()=>go(i);dots.appendChild(d)});
const dEls=[...dots.children];
const pad2=n=>String(n).padStart(2,'0');
const REDUCE=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const easeOut=t=>1-Math.pow(1-t,3);

function go(i){
  cur=Math.max(0,Math.min(S.length-1,i));
  S.forEach((s,k)=>s.classList.toggle('active',k===cur));
  dEls.forEach((d,k)=>d.classList.toggle('on',k===cur));
  document.getElementById('sb-pos').textContent=pad2(cur+1)+' / '+pad2(S.length);
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===S.length-1;
}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
window.addEventListener('keydown',e=>{const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1); if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);});
go(0);
</script>
